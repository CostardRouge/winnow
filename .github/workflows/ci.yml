name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

# Cancel an in-progress run when a new commit lands on the same PR. On `main`,
# head_ref is empty -> fallback to run_id (unique) -> main runs are never
# cancelled, so every commit pushed to main is validated end-to-end.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Static checks — no services needed, so this fails fast: Biome over src/
  # (biome.jsonc), then `tsc --noEmit`.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # .nvmrc holds the major the runtime image pins exactly (Dockerfile),
          # so CI validates what ships.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Migrations, the tests and the build against a real Postgres (the SQL is
  # part of the contract). The job keeps its name: a branch-protection rule
  # lists its required checks by name.
  build:
    name: Build & migrations
    runs-on: ubuntu-24.04

    services:
      postgres:
        # pgvector superset of postgres:16. The CLIP-search migration (0030) now
        # SKIPS its table where the extension is missing instead of failing, so
        # a plain postgres:16 would migrate fine — and silently never exercise
        # the asset_clip DDL. Keep the pgvector image: it is what makes CI cover
        # the branch that actually creates the table.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: winnow
          POSTGRES_PASSWORD: winnow
          POSTGRES_DB: winnow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winnow -d winnow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://winnow:winnow@localhost:5432/winnow
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations (validates SQL)
        run: npm run migrate

      # The whole suite, the database-backed tests included: they run only
      # when WINNOW_TEST_DATABASE_URL names a migrated scratch database, which
      # the step above has just made of this job's Postgres (src/test/db.ts —
      # never DATABASE_URL, so a test can never land rows in a real library).
      - name: Tests
        run: npm test
        env:
          WINNOW_TEST_DATABASE_URL: postgres://winnow:winnow@localhost:5432/winnow

      - name: Production build
        run: npm run build
