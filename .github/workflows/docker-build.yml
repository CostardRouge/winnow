name: Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    env:
      # Optional: point this at the Watchtower HTTP API on the Optiplex/NAS to
      # trigger an instant redeploy after each push. Leave the secrets unset and
      # the build still publishes — only the redeploy step is skipped.
      #   DEPLOY_WEBHOOK_URL   e.g. https://watchtower.example.com/v1/update?image=ghcr.io/costardrouge/winnow
      #   DEPLOY_WEBHOOK_TOKEN matches WATCHTOWER_HTTP_API_TOKEN on the host
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the image name (CostardRouge -> costardrouge).
          images: ghcr.io/${{ github.repository }}
          # `main` + `latest` are moving tags (what Watchtower re-pulls);
          # `sha-<short>` is immutable and what you pin to for a rollback.
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-side layer cache keyed on the workflow run, so unchanged
          # layers (base image, npm deps) aren't rebuilt every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger redeploy (Watchtower HTTP API)
        if: env.DEPLOY_WEBHOOK_URL != ''
        # Watchtower's /v1/update answers only once it has pulled and recreated
        # the containers, and Cloudflare cuts any origin that takes over 100 s
        # with a 524. A new base layer is a long pull (#335's Node 24 revert),
        # so a 524 means "still updating", not "failed": warn, don't fail the
        # run, and don't retry it (a retry would queue a second update behind
        # the first). The image is already pushed by then; Watchtower's own
        # poll would deploy it anyway. Anything else that isn't a 2xx fails.
        run: |
          echo "Triggering Watchtower update…"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}" \
              "${DEPLOY_WEBHOOK_URL}") || code=000
            case "$code" in
              2??) echo "Watchtower updated (HTTP $code)."; exit 0 ;;
              524) echo "::warning::Watchtower took over Cloudflare's 100 s (HTTP 524): the update carries on at the origin. Check the instance's version (Settings › Instance)."; exit 0 ;;
              000|502|503|504) echo "Attempt $attempt: HTTP $code, retrying in 5 s…"; sleep 5 ;;
              *) echo "::error::Watchtower answered HTTP $code."; exit 1 ;;
            esac
          done
          echo "::error::Watchtower unreachable after 3 attempts (last HTTP $code)."
          exit 1
