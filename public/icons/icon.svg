<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Winnow">
  <!-- Winnow app mark: warm paper tile with the vermillion sieve. Six grains
       press against the screen on the left, two make it through on the right —
       a lot goes in, little comes out. The mass is filled at half opacity
       rather than outlined: a hollow ring closes up at favicon size, a disc
       does not. -->
  <rect width="512" height="512" rx="112" fill="#f4f0e7"/>
  <g transform="translate(96 96) scale(13.333)">
    <path d="M12.9 3.6V20.4" fill="none" stroke="#d9442a" stroke-width="1.4" stroke-linecap="round" opacity="0.32"/>
    <g fill="#d9442a" opacity="0.5">
      <circle cx="4.2" cy="6.3" r="1.5"/>
      <circle cx="9" cy="6.3" r="1.5"/>
      <circle cx="4.2" cy="12" r="1.5"/>
      <circle cx="9" cy="12" r="1.5"/>
      <circle cx="4.2" cy="17.7" r="1.5"/>
      <circle cx="9" cy="17.7" r="1.5"/>
    </g>
    <g fill="#d9442a">
      <circle cx="18.7" cy="8.5" r="2.5"/>
      <circle cx="18.7" cy="15.5" r="2.5"/>
    </g>
  </g>
</svg>
