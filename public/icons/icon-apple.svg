<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Winnow">
  <!-- Apple touch icon: full-bleed paper square (iOS applies its own rounded mask)
       with extra padding so the mark isn't clipped by the corner radius. -->
