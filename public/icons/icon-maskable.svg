<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Winnow">
  <!-- Maskable variant: vermillion bleeds to the edges so platform masks (circle,
       squircle, rounded-rect) never clip the mark. Art stays inside the safe zone.

       The mass and sieve opacities are higher than in icon.svg (0.68/0.45 against
       0.5/0.32): fading paper toward a saturated vermillion loses far more
       perceived contrast than fading vermillion toward paper, so the favicon's
       values go murky once inverted. The Brand component carries the same raised
       values for the same reason. -->
  <rect width="512" height="512" fill="#d9442a"/>
  <g transform="translate(128 128) scale(10.667)">
    <path d="M12.9 3.6V20.4" fill="none" stroke="#f4f0e7" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
    <g fill="#f4f0e7" opacity="0.68">
      <circle cx="4.2" cy="6.3" r="1.5"/>
      <circle cx="9" cy="6.3" r="1.5"/>
      <circle cx="4.2" cy="12" r="1.5"/>
      <circle cx="9" cy="12" r="1.5"/>
      <circle cx="4.2" cy="17.7" r="1.5"/>
      <circle cx="9" cy="17.7" r="1.5"/>
    </g>
    <g fill="#f4f0e7">
      <circle cx="18.7" cy="8.5" r="2.5"/>
      <circle cx="18.7" cy="15.5" r="2.5"/>
    </g>
  </g>
</svg>
