<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Winnow</title>
    <meta
      name="theme-color"
      content="#f4f0e7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#16130e"
      media="(prefers-color-scheme: dark)"
    />
    <style>
      :root {
        --bg: #f4f0e7;
        --surface: #fbf8f1;
        --border: #e2dac9;
        --text: #1b1813;
        --muted: #7c7464;
        --accent: #d9442a;
      }
      /* "Papier nuit" — mirror the app's dark tokens for the offline fallback. */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16130e;
          --surface: #2a251c;
          --border: #2d2820;
          --text: #f2ece0;
          --muted: #a49a86;
          --accent: #ef5638;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 40px 32px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 30px -14px rgba(27, 24, 19, 0.18);
      }
      .mark { width: 56px; height: 56px; margin: 0 auto 20px; display: block; }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: 28px;
        margin: 0 0 8px;
      }
      p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
      button {
        appearance: none;
        border: none;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 11px 22px;
        border-radius: 11px;
        cursor: pointer;
      }
      button:hover { background: #b2331e; }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- The sieve mark, hardcoded: this page is served by the service worker
           with no CSS bundle, so it cannot reach a token. Keep it in step with
           the Brand component in src/app/ui.tsx. -->
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12.9 3.6V20.4" stroke="#d9442a" stroke-width="1.2" stroke-linecap="round" opacity="0.32" />
        <g fill="#d9442a" opacity="0.5">
          <circle cx="4.2" cy="6.3" r="1.5" />
          <circle cx="9" cy="6.3" r="1.5" />
          <circle cx="4.2" cy="12" r="1.5" />
          <circle cx="9" cy="12" r="1.5" />
          <circle cx="4.2" cy="17.7" r="1.5" />
          <circle cx="9" cy="17.7" r="1.5" />
        </g>
        <g fill="#d9442a">
          <circle cx="18.7" cy="8.5" r="2.5" />
          <circle cx="18.7" cy="15.5" r="2.5" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>
        Winnow needs a connection to your NAS to index, triage and export media.
        Reconnect and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
