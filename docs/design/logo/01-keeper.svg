<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Winnow">
  <!-- 01 · Le grain retenu — four grains on a diagonal: three drift away shrinking
       and fading, one stays solid. One kept out of four: the selection rate, drawn. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <circle cx="19.4" cy="5.2" r="1.15" stroke-width="1.05" opacity=".45"/>
    <circle cx="15.6" cy="9.3" r="1.6" stroke-width="1.25" opacity=".65"/>
    <circle cx="11" cy="13.6" r="2.1" stroke-width="1.5"/>
    <circle cx="5.7" cy="18.6" r="2.9" fill="currentColor" stroke="none"/>
  </g>
</svg>
