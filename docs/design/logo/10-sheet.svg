<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Winnow">
  <!-- 10 · La planche-contact — nine frames, one kept solid, one struck through. No
       translation needed: any photographer reads the culling grid before reading the
       word. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <g stroke-width="1.1" opacity=".42">
      <rect x="2.6" y="2.6" width="6" height="6" rx="1.3"/>
      <rect x="9" y="2.6" width="6" height="6" rx="1.3"/>
      <rect x="15.4" y="2.6" width="6" height="6" rx="1.3"/>
      <rect x="2.6" y="9" width="6" height="6" rx="1.3"/>
      <rect x="15.4" y="9" width="6" height="6" rx="1.3"/>
      <rect x="2.6" y="15.4" width="6" height="6" rx="1.3"/>
      <rect x="9" y="15.4" width="6" height="6" rx="1.3"/>
      <rect x="15.4" y="15.4" width="6" height="6" rx="1.3"/>
    </g>
    <rect x="9" y="9" width="6" height="6" rx="1.3" fill="currentColor" stroke="none"/>
    <path d="M16.7 16.7 20.1 20.1" stroke-width="1.2" opacity=".5"/>
  </g>
</svg>
