    <path d="M3.2 4.8 7.9 19.2" stroke-width="2.7"/>
    <path d="M7.9 19.2 12 8.2" stroke-width="1.05"/>
    <path d="M12 8.2 16.1 19.2" stroke-width="2.7"/>
    <path d="M16.1 19.2 20.8 4.8" stroke-width="1.05"/>
  </g>
</svg>
