<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Winnow">
  <!-- 09 · Le vent — the whole story in one glyph: the fan, the grain dropping back
       into it, and the chaff blowing off along a drift line, fading out. The only
       variant that shows the sorting *and* its result. -->
